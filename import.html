function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function setProgress(pct) { document.getElementById('prog').style.width = pct + '%'; }

function startImport() {
  document.getElementById('btn').disabled = true;
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive',
    callback: async (resp) => {
      if (resp.error) { log('Erreur auth: ' + resp.error, 'err'); document.getElementById('btn').disabled=false; return; }
      accessToken = resp.access_token;
      log('✓ Connecté à Google Drive', 'ok');
      await runImport();
    }
  });
  tokenClient.requestAccessToken({prompt: 'consent'});
}

async function runImport() {
  try {
    log('Chargement des données…');
    const [grillesRes, auditsRes] = await Promise.all([fetch('grilles_data.json'), fetch('audits_data.json')]);
    const grilles = await grillesRes.json();
    const audits = await auditsRes.json();
    log(`→ ${grilles.length} grilles, ${audits.length} audits, ${Object.keys(PHOTO_MAP).length} audits avec photos`);

    log('Upload grilles.json…');
    await uploadOrUpdate('grilles.json', JSON.stringify(grilles, null, 2), 'application/json', FOLDER_ID);
    log('✓ grilles.json', 'ok');

    // Cache for Drive folder lookups
    const folderCache = {};
    const indexEntries = [];
    let done = 0;

    for (const audit of audits) {
      done++;
      setProgress(Math.round(done / audits.length * 90));
      const dateStr = new Date(audit.date).toLocaleDateString('fr-FR');
      const folderName = `${audit.site} — ${dateStr} — ${audit.id}`;
      log(`[${done}/${audits.length}] ${audit.site} · ${audit.grilleName}`);

      const auditFolderId = await getOrCreateFolder(folderName, FOLDER_ID);
      audit.driveFolderId = auditFolderId;

      // Map photos
      const auditPhotos = PHOTO_MAP[audit.id];
      if (auditPhotos) {
        if (!audit.answers) audit.answers = {};
        let ok = 0, warn = 0;
        for (const [qId, paths] of Object.entries(auditPhotos)) {
          if (!audit.answers[qId]) audit.answers[qId] = {val:null, comment:'', photos:[]};
          const photoLinks = [];
          for (const picPath of paths) {
            try {
              const fileId = await findInPictures(picPath, folderCache);
              if (fileId) {
                const filename = picPath.split('/').pop();
                const copiedId = await copyFile(fileId, filename, auditFolderId);
                photoLinks.push(`https://drive.google.com/uc?id=${copiedId}`);
                ok++;
              } else { warn++; }
            } catch(e) { log(`  ✗ ${e.message}`, 'err'); warn++; }
          }
          if (photoLinks.length) audit.answers[qId].photos = photoLinks;
        }
        log(`  📸 ${ok} photos copiées${warn ? `, ${warn} introuvables` : ''}`, ok > 0 ? 'ok' : 'warn');
      }

      // Upload rapport.json
      const rapport = {
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName || '', date: audit.date,
        auditor: audit.auditor, status: audit.status,
        answers: audit.answers || {},
        stats: audit.stats || {conformity:0, majors:0, minors:0, concerns:0}
      };
      await uploadOrUpdate('rapport.json', JSON.stringify(rapport, null, 2), 'application/json', auditFolderId);

      // Avoid Drive API rate limit
      await new Promise(r => setTimeout(r, 800));

      indexEntries.push({
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName || '', date: audit.date,
        auditor: audit.auditor, status: audit.status,
        driveFolderId: auditFolderId,
        stats: audit.stats || {conformity:0, majors:0, minors:0, concerns:0}
      });
    }

    log('Upload audits_index.json…');
    await uploadOrUpdate('audits_index.json', JSON.stringify(indexEntries, null, 2), 'application/json', FOLDER_ID);
    log('✓ audits_index.json', 'ok');

    setProgress(100);
    log(`\n✅ Import terminé ! ${audits.length} audits importés avec leurs photos.`, 'ok');
    log('Tu peux fermer cette page.', 'ok');
    document.getElementById('btn').textContent = '✓ Terminé';

  } catch(e) {
    log('Erreur fatale: ' + e.message, 'err');
    console.error(e);
    document.getElementById('btn').disabled = false;
  }
}

// Parse /Pictures/{city}/{...folders}/{filename} and find on Drive
async function findInPictures(picPath, cache) {
  const rel = picPath.replace(/^\/Pictures\//, '');
  const parts = rel.split('/');
  const filename = parts.pop();
  // City is always first part
  const city = parts[0];
  // Everything between city and filename is the folder path
  const dateParts = parts.slice(1);

  const cacheKey = city + '|||' + dateParts.join('/');
  if (cache[cacheKey] === undefined) {
    // Find city folder
    const cityId = await findFolder(PICTURES_ID, city);
    if (!cityId) { cache[cacheKey] = null; return null; }
    // Navigate all date sub-folders
    let currentId = cityId;
    for (const part of dateParts) {
      const id = await findFolder(currentId, part);
      if (!id) { cache[cacheKey] = null; return null; }
      currentId = id;
    }
    cache[cacheKey] = currentId;
  }
  if (!cache[cacheKey]) return null;

  const folderId = cache[cacheKey];
  const q = `'${folderId}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=200`);
  const files = res.files || [];
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // 1. Exact match
  const exact = files.find(f => f.name === filename);
  if (exact) return exact.id;
  // 2. Normalized exact match
  const normFilename = norm(filename);
  const normMatch = files.find(f => norm(f.name) === normFilename);
  if (normMatch) return normMatch.id;
  // 3. Match ignoring timestamp — strip last dot-segment (e.g. ".060724" before ".jpg")
  const stripTimestamp = s => s.replace(/\.\d{6}(\.[^.]+)$/, '$1');
  const filenameNoTs = norm(stripTimestamp(filename));
  const tsMatch = files.find(f => norm(stripTimestamp(f.name)) === filenameNoTs);
  if (tsMatch) return tsMatch.id;
  // 4. Match on auditId + description prefix only
  const prefix = filename.split('.').slice(0, 2).join('.').toLowerCase();
  const prefixMatch = files.find(f => f.name.toLowerCase().startsWith(prefix));
  return prefixMatch?.id || null;
}

async function findFolder(parentId, name) {
  const q = `'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=50`);
  const folders = res.files || [];
  // 1. Exact match
  const exact = folders.find(f => f.name === name);
  if (exact) return exact.id;
  // 2. Case-insensitive exact match (preserving accents)
  const lower = name.toLowerCase();
  const caseMatch = folders.find(f => f.name.toLowerCase() === lower);
  if (caseMatch) return caseMatch.id;
  // 3. Normalized match (strip accents) — but only if no accent-preserving match found
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,' ').trim();
  const normName = norm(name);
  const normalized = folders.find(f => norm(f.name) === normName);
  if (normalized) return normalized.id;
  // 4. Partial match on first meaningful words
  const firstWords = normName.split(' ').filter(w => w.length > 2).slice(0, 3).join(' ');
  const partial = folders.find(f => norm(f.name).includes(firstWords));
  if (partial) return partial.id;
  log(`  🔍 Dossier "${name}" introuvable. Dispo: ${folders.map(f=>f.name).join(' | ')}`, 'warn');
  return null;
}

async function copyFile(fileId, name, destId) {
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files/${fileId}/copy?supportsAllDrives=true`, 'POST', {name, parents:[destId]});
  return res.id;
}

async function getOrCreateFolder(name, parentId) {
  const q = `name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (res.files?.[0]) return res.files[0].id;
  const f = await driveReq('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true', 'POST', {name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]});
  return f.id;
}

async function uploadOrUpdate(name, content, mimeType, parentId) {
  const q = `name='${name}' and '${parentId}' in parents and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (res.files?.[0]) {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${res.files[0].id}?uploadType=media&supportsAllDrives=true`, {
      method:'PATCH', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':mimeType}, body:content
    });
  } else {
    const base64 = btoa(unescape(encodeURIComponent(content)));
    const b = 'ib';
    const body = `--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name,parents:[parentId]})}\r\n--${b}\r\nContent-Type: ${mimeType}\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64}\r\n--${b}--`;
    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {
      method:'POST', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${b}`}, body
    });
  }
}

async function driveReq(url, method='GET', body=null) {
  const opts = {method, headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:{message:r.status}})); throw new Error(e.error?.message||r.status); }
  return r.json();
}
