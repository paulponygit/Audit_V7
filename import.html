48.jpg"], "question59": ["/Bayonne/Thu Aug 07 2025 00-00-00 GMT+0200 (heure d'été d'Europe centrale)/31838dd6W.Picture - Common bins.151642.jpg"]}, "bae42fa7M": {"question7": ["/Angers/Thu Aug 14 2025 00-00-00 GMT+0200 (Central European Summer Time)/bae42fa7M.Picture - Dropped Off Zone (WH).141107.jpg"], "question9": ["/Angers/Thu Aug 14 2025 00-00-00 GMT+0200 (Central European Summer Time)/bae42fa7M.Picture - Waiting repair zone.141122.jpg"], "question11": ["/Angers/Thu Aug 14 2025 00-00-00 GMT+0200 (Central European Summer Time)/bae42fa7M.Picture - Deployment Zone.141138.jpg"]}, "bae42fa7Q": {"question49": ["/Angers/20250814/bae42fa7Q.Picture - Tools.124914.jpg"], "question54": ["/Angers/20250814/bae42fa7Q.Picture - Spare Parts.125011.jpg"], "question62": ["/Angers/20250814/bae42fa7Q.Picture - Zones.125048.jpg"], "question74": ["/Angers/20250814/bae42fa7Q.Picture - Vehicle part bins.125323.jpg"], "question78": ["/Angers/20250814/bae42fa7Q.Picture if battery at unidentified places.130715.jpg"], "question80": ["/Angers/20250814/bae42fa7Q.Picture if chemical products not well stored.130744.jpg"]}};

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function setProgress(pct) { document.getElementById('prog').style.width = pct + '%'; }

function startImport() {
  document.getElementById('btn').disabled = true;
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive',
    callback: async (resp) => {
      if (resp.error) { log('Erreur auth: ' + resp.error, 'err'); document.getElementById('btn').disabled=false; return; }
      accessToken = resp.access_token;
      log('✓ Connecté à Google Drive', 'ok');
      await runImport();
    }
  });
  tokenClient.requestAccessToken({prompt: 'consent'});
}

async function runImport() {
  try {
    log('Chargement des données…');
    const [grillesRes, auditsRes] = await Promise.all([fetch('grilles_data.json'), fetch('audits_data.json')]);
    const grilles = await grillesRes.json();
    const audits = await auditsRes.json();
    log(`→ ${grilles.length} grilles, ${audits.length} audits`);

    // Build Pictures folder index (one-time listing per subfolder)
    log('Indexation du dossier Pictures…');
    const picturesIndex = await buildPicturesIndex();
    log(`✓ ${Object.keys(picturesIndex).length} fichiers indexés`, 'ok');

    log('Upload grilles.json…');
    await uploadOrUpdate('grilles.json', JSON.stringify(grilles, null, 2), 'application/json', FOLDER_ID);
    log('✓ grilles.json', 'ok');

    const folderNameCount = {};
    const indexEntries = [];
    let done = 0;

    for (const audit of audits) {
      done++;
      setProgress(Math.round(done / audits.length * 90));
      const dateStr = new Date(audit.date).toLocaleDateString('fr-FR');
      log(`[${done}/${audits.length}] ${audit.site} · ${audit.grilleName}`);

      // City folder
      const cityFolderId = await getOrCreateFolder(audit.site, FOLDER_ID);

      // Type - Date folder with dedup
      const baseName = `${audit.grilleName} - ${dateStr}`;
      const nameKey = audit.site + '/' + baseName;
      folderNameCount[nameKey] = (folderNameCount[nameKey] || 0) + 1;
      const folderName = folderNameCount[nameKey] > 1 ? `${baseName} (${folderNameCount[nameKey]})` : baseName;
      const auditFolderId = await getOrCreateFolder(folderName, cityFolderId);
      audit.driveFolderId = auditFolderId;

      // Copy photos using direct index
      const auditPhotos = PHOTO_MAP[audit.id];
      if (auditPhotos) {
        if (!audit.answers) audit.answers = {};
        let ok = 0, miss = 0;
        for (const [qId, paths] of Object.entries(auditPhotos)) {
          if (!audit.answers[qId]) audit.answers[qId] = {val:null, comment:'', photos:[]};
          const photoLinks = [];
          for (const drivePath of paths) {
            const fileId = picturesIndex[drivePath];
            if (fileId) {
              const filename = drivePath.split('/').pop();
              const copiedId = await copyFile(fileId, filename, auditFolderId);
              photoLinks.push(`https://drive.google.com/uc?id=${copiedId}`);
              ok++;
            } else {
              log(`  ⚠ Absent: ${drivePath.split('/').pop()}`, 'warn');
              miss++;
            }
          }
          if (photoLinks.length) audit.answers[qId].photos = photoLinks;
        }
        log(`  📸 ${ok} photos copiées${miss ? `, ${miss} absentes` : ''}`, ok > 0 ? 'ok' : 'warn');
      }

      // Upload rapport.json
      const rapport = {
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName || '', date: audit.date,
        auditor: audit.auditor, status: audit.status,
        answers: audit.answers || {},
        stats: audit.stats || {conformity:0, majors:0, minors:0, concerns:0}
      };
      await uploadOrUpdate('rapport.json', JSON.stringify(rapport, null, 2), 'application/json', auditFolderId);

      indexEntries.push({
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName || '', date: audit.date,
        auditor: audit.auditor, status: audit.status,
        driveFolderId: auditFolderId,
        stats: audit.stats || {conformity:0, majors:0, minors:0, concerns:0}
      });

      await new Promise(r => setTimeout(r, 600));
    }

    log('Upload audits_index.json…');
    await uploadOrUpdate('audits_index.json', JSON.stringify(indexEntries, null, 2), 'application/json', FOLDER_ID);
    log('✓ audits_index.json', 'ok');

    setProgress(100);
    log(`\n✅ Import terminé ! ${audits.length} audits + photos importés.`, 'ok');
    log('Tu peux fermer cette page.', 'ok');
    document.getElementById('btn').textContent = '✓ Terminé';

  } catch(e) {
    log('Erreur fatale: ' + e.message, 'err');
    console.error(e);
    document.getElementById('btn').disabled = false;
  }
}

// Build a flat index of all files in Pictures: path -> fileId
async function buildPicturesIndex() {
  const index = {};
  await indexFolder(PICTURES_ID, '', index);
  return index;
}

async function indexFolder(folderId, path, index) {
  const q = `'${folderId}' in parents and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=1000`);
  for (const f of res.files || []) {
    const fullPath = path + '/' + f.name;
    if (f.mimeType.includes('folder')) {
      await indexFolder(f.id, fullPath, index);
    } else {
      index[fullPath] = f.id;
    }
  }
}

async function copyFile(fileId, name, destId) {
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files/${fileId}/copy?supportsAllDrives=true`, 'POST', {name, parents:[destId]});
  return res.id;
}

async function getOrCreateFolder(name, parentId) {
  const q = `name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (res.files?.[0]) return res.files[0].id;
  const f = await driveReq('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true', 'POST',
    {name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]});
  return f.id;
}

async function uploadOrUpdate(name, content, mimeType, parentId) {
  const q = `name='${name}' and '${parentId}' in parents and trashed=false`;
  const res = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (res.files?.[0]) {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${res.files[0].id}?uploadType=media&supportsAllDrives=true`, {
      method:'PATCH', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':mimeType}, body:content
    });
  } else {
    const base64 = btoa(unescape(encodeURIComponent(content)));
    const b = 'ib';
    const body = `--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name,parents:[parentId]})}\r\n--${b}\r\nContent-Type: ${mimeType}\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64}\r\n--${b}--`;
    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {
      method:'POST', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${b}`}, body
    });
  }
}

async function driveReq(url, method='GET', body=null) {
  const opts = {method, headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:{message:r.status}})); throw new Error(e.error?.message||r.status); }
  return r.json();
}
