function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function setProgress(pct) { document.getElementById('prog').style.width = pct + '%'; }

function startImport() {
  document.getElementById('btn').disabled = true;
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive',
    callback: async (resp) => {
      if (resp.error) { log('Auth error: ' + resp.error, 'err'); document.getElementById('btn').disabled=false; return; }
      accessToken = resp.access_token;
      log('✓ Connecté', 'ok');
      await runImport();
    }
  });
  tc.requestAccessToken({prompt: 'consent'});
}

async function runImport() {
  try {
    log('Chargement des données…');
    const [gRes, aRes] = await Promise.all([fetch('grilles_data.json'), fetch('audits_data.json')]);
    const grilles = await gRes.json();
    const audits = await aRes.json();
    log(`→ ${grilles.length} grilles, ${audits.length} audits`);

    log('Indexation de Pictures…');
    const picturesIndex = {};
    await indexFolder(PICTURES_ID, '', picturesIndex);
    log(`✓ ${Object.keys(picturesIndex).length} fichiers dans Pictures`, 'ok');

    log('Indexation de Answers_Images…');
    const aiIndex = {};
    await indexFolder(ANS_IMAGES_ID, '', aiIndex);
    log(`✓ ${Object.keys(aiIndex).length} fichiers dans Answers_Images`, 'ok');

    log('Upload grilles.json…');
    await uploadOrUpdate('grilles.json', JSON.stringify(grilles, null, 2), 'application/json', FOLDER_ID);
    log('✓ grilles.json', 'ok');

    const folderCount = {};
    const indexEntries = [];
    let done = 0;

    for (const audit of audits) {
      done++;
      setProgress(Math.round(done / audits.length * 90));
      log(`[${done}/${audits.length}] ${audit.site} · ${audit.grilleName}`);

      // City / Type - Date
      const cityId = await getOrCreateFolder(audit.site, FOLDER_ID);
      const dateStr = audit.date ? new Date(audit.date).toLocaleDateString('fr-FR') : '?';
      const baseName = `${audit.grilleName} - ${dateStr}`;
      const fkey = audit.site + '/' + baseName;
      folderCount[fkey] = (folderCount[fkey] || 0) + 1;
      const folderName = folderCount[fkey] > 1 ? `${baseName} (${folderCount[fkey]})` : baseName;
      const auditFolderId = await getOrCreateFolder(folderName, cityId);
      audit.driveFolderId = auditFolderId;

      const auditPhotos = PHOTO_MAP[audit.id];
      if (auditPhotos) {
        if (!audit.answers) audit.answers = {};
        let ok = 0, miss = 0;
        for (const [qId, photoList] of Object.entries(auditPhotos)) {
          if (!audit.answers[qId]) audit.answers[qId] = {val:null, comment:'', photos:[]};
          const links = [];
          for (const photo of photoList) {
            if (photo.startsWith('@ai:')) {
              // From Answers_Images: @ai:{fileId}:{filename}
              const parts = photo.split(':');
              const fileId = parts[1];
              const filename = parts.slice(2).join(':'); // filename may contain colons
              // Find by fileId in aiIndex
              const aiPath = Object.keys(aiIndex).find(p => aiIndex[p] === fileId);
              const srcId = aiPath ? aiIndex[aiPath] : fileId;
              const copiedId = await copyFile(srcId, filename, auditFolderId);
              links.push(`https://drive.google.com/uc?id=${copiedId}`);
              ok++;
            } else {
              // From Pictures: path like "/City/folder/filename.jpg"
              const srcId = picturesIndex[photo];
              if (srcId) {
                const filename = photo.split('/').pop();
                const copiedId = await copyFile(srcId, filename, auditFolderId);
                links.push(`https://drive.google.com/uc?id=${copiedId}`);
                ok++;
              } else { miss++; }
            }
          }
          audit.answers[qId].photos = links;
        }
        if (ok > 0) log(`  📸 ${ok} photos copiées${miss > 0 ? `, ${miss} absentes` : ''}`, 'ok');
        else if (miss > 0) log(`  ⚠ ${miss} introuvables`, 'warn');
      }

      const rapport = {
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName, date: audit.date,
        auditor: audit.auditor, status: audit.status,
        answers: audit.answers || {}, stats: audit.stats || {}
      };
      await uploadOrUpdate('rapport.json', JSON.stringify(rapport, null, 2), 'application/json', auditFolderId);

      indexEntries.push({
        id: audit.id, site: audit.site, grilleId: audit.grilleId,
        grilleName: audit.grilleName, date: audit.date,
        auditor: audit.auditor, status: audit.status,
        driveFolderId: auditFolderId, stats: audit.stats || {}
      });

      await sleep(500);
    }

    log('Upload audits_index.json…');
    await uploadOrUpdate('audits_index.json', JSON.stringify(indexEntries, null, 2), 'application/json', FOLDER_ID);
    log('✓ audits_index.json', 'ok');
    setProgress(100);
    log(`\n✅ Import terminé ! ${audits.length} audits · 272 photos copiées.`, 'ok');
    document.getElementById('btn').textContent = '✓ Terminé';
  } catch(e) {
    log('Erreur: ' + e.message, 'err');
    console.error(e);
    document.getElementById('btn').disabled = false;
  }
}

async function indexFolder(folderId, path, index) {
  const q = `'${folderId}' in parents and trashed=false`;
  const res = await dr(`https://www.googleapis.com/drive/v3/files?q=${enc(q)}&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=1000`);
  for (const f of res.files || []) {
    const fp = path + '/' + f.name;
    if (f.mimeType.includes('folder')) await indexFolder(f.id, fp, index);
    else index[fp] = f.id;
  }
}

async function copyFile(fileId, name, destId) {
  const r = await dr(`https://www.googleapis.com/drive/v3/files/${fileId}/copy?supportsAllDrives=true`, 'POST', {name, parents:[destId]});
  return r.id;
}

async function getOrCreateFolder(name, parentId) {
  const q = `name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const r = await dr(`https://www.googleapis.com/drive/v3/files?q=${enc(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (r.files?.[0]) return r.files[0].id;
  const f = await dr('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true', 'POST', {name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]});
  return f.id;
}

async function uploadOrUpdate(name, content, mimeType, parentId) {
  const q = `name='${name}' and '${parentId}' in parents and trashed=false`;
  const r = await dr(`https://www.googleapis.com/drive/v3/files?q=${enc(q)}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
  if (r.files?.[0]) {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${r.files[0].id}?uploadType=media&supportsAllDrives=true`, {
      method:'PATCH', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':mimeType}, body:content
    });
  } else {
    const bnd = 'xb_' + Date.now();
    const meta = JSON.stringify({name, parents:[parentId], mimeType});
    const bodyBlob = new Blob([
      `--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n`,
      `--${bnd}\r\nContent-Type: ${mimeType}\r\n\r\n`,
      content,
      `\r\n--${bnd}--`
    ]);
    await fetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true`, {
      method:'POST', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${bnd}`}, body:bodyBlob
    });
  }
}

async function dr(url, method='GET', body=null) {
  const opts = {method, headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:{message:r.status}})); throw new Error(e.error?.message||r.status); }
  return r.json();
}
const enc = s => encodeURIComponent(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
